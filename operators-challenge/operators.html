<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>replit</title>

    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <h4>
      Create 3 textboxes for entering three numbers Create a button "Analyze
      Numbers" Check if first > second > third (descending order) Check if all
      three are equal Check if they form an arithmetic progression Display
      results using console.log with detailed messages
    </h4>
    <hr />
  <input type="number" class="num1" />
<input type="number" class="num2" />
<input type="number" class="num3" />
<button class="btn" onclick="analyzeNumbers()">Analyze Numbers</button>
    <!-- <script src="script.js"></script> -->
    <script src="task.js"></script>
    <script>
let firstValue = document.querySelector(".num1");
let secondValue = document.querySelector(".num2");
let thirdValue = document.querySelector(".num3");

function analyzeNumbers() {

  let firstNumber = Number(firstValue.value);
  let secondNumber = Number(secondValue.value);
  let thirdNumber = Number(thirdValue.value);

  // Descending check
  if (firstNumber > secondNumber && secondNumber > thirdNumber) {
    console.log("Descending Order");
  } else {
    console.log("Not Descending Order");
  }

  // Equal check
  if (firstNumber === secondNumber && secondNumber === thirdNumber) {
    console.log("All Three are Equal");
  } else {
    console.log("Not Equal");
  }

  // Arithmetic Progression check
  if (firstNumber - secondNumber === secondNumber - thirdNumber) {
    console.log("Arithmetic Progression");
  } else {
    console.log("Not Arithmetic Progression");
  }
}
</script>
  </body>
</html>
